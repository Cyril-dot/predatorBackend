spring.application.name=subscription-platform
server.port=8080

# ==============================
# Paystack configuration
# ==============================
# Get these from https://dashboard.paystack.com/#/settings/developer
paystack.secret-key=sk_test_replace_with_your_secret_key
paystack.public-key=pk_test_replace_with_your_public_key
paystack.base-url=https://api.paystack.co
# Where Paystack should redirect the user after payment (your frontend page)
paystack.callback-url=http://localhost:3000/payment/callback

# ==============================
# Subscription plans (cedis / hours)
# ==============================
plan.two-hour.amount=200
plan.two-hour.hours=2
plan.three-hour.amount=350
plan.three-hour.hours=3
plan.five-hour.amount=500
plan.five-hour.hours=5

# ==============================
# Session / scheduler
# ==============================
# How often (ms) the background job scans for expired sessions and force logs-out users
session.cleanup.interval-ms=30000

# Generated password length
account.password.length=10

# ==============================
# Admin / Super Admin
# ==============================
# How long an admin-panel login session lasts before needing to log in again
admin.session.duration-hours=12

# Default referral commission split when a super admin creates an admin
# without specifying adminSharePercent explicitly (admin gets 30%, platform 70%)
referral.default-admin-share-percent=30
referral.default-platform-share-percent=70

# Bootstrap super admin - created automatically on first startup if it
# doesn't already exist. CHANGE THESE before deploying anywhere real.
superadmin.bootstrap.username=superadmin@platform.com
superadmin.bootstrap.password=ChangeMe123!

# Used to build shareable referral links, e.g. {frontend-base-url}/register?ref=REF-XXXXXX
app.frontend-base-url=http://localhost:3000

# ==============================
# Manual payment (mobile money / bank transfer)
# ==============================
# Screenshots are held in memory on the ManualPayment record itself (byte[]),
# consistent with the rest of this app's in-memory design - nothing is
# written to disk, so nothing is orphaned across a restart. Keep max file
# size reasonable since it all lives in RAM.
# Bumped from 3MB/4MB to fit betting-slip scan images too (see AI scan
# section below) - base64-encoding an image for the AI call adds ~33% size.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

logging.level.com.example.subscription=DEBUG

# ==============================
# AI betting-slip scan (NVIDIA-hosted model, OpenAI-compatible API)
# ==============================
# Payment for scans is manual only - see ScanPurchase / ScanPurchaseController.
# Get an API key from https://build.nvidia.com (or your NVIDIA NIM deployment).
# Set the real key via the NVIDIA_API_KEY environment variable - do not commit it here.
nvidia.api-key=${NVIDIA_API_KEY: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}
nvidia.base-url=https://integrate.api.nvidia.com/v1
# NOTE: this must be a vision-capable ("VLM") NVIDIA NIM model to actually
# read the uploaded image - swap this if your chosen model is text-only.
nvidia.model=meta/llama-3.2-90b-vision-instruct

# Scan plan pricing (GHS) / picks-per-slip coverage - kept here for reference,
# the authoritative values live in the ScanPlan enum:
#   SCAN_300  -> 2 picks analyzed per slip
#   SCAN_500  -> 5 picks analyzed per slip
#   SCAN_1000 -> full coverage (every pick on the slip)

# =====================================================================
# AI config - Hugging Face primary, with logging
# =====================================================================

# Providers tried in order. Any provider with a blank api-key is skipped.
ai.providers=huggingface,nvidia,together,openrouter

# 60s, not 5s. A vision model producing 2-4k tokens of JSON with stream=false
# routinely needs 20-60s. The old 5s value guaranteed every model "timed out".
ai.attempt-timeout-seconds=60

# ---------------------------------------------------------------------
# HUGGING FACE  (primary)  -  https://huggingface.co/settings/tokens
#
# Token: create a Fine-grained token with "Make calls to Inference Providers"
# enabled, or a Read token. Billing must be enabled on the account once the
# included monthly credit runs out, otherwise you get HTTP 402.
#
# Model ids are normal HF repo ids. Append ":partner" to pin a specific
# inference partner instead of letting HF auto-route, e.g.:
#   Qwen/Qwen2.5-VL-72B-Instruct:novita
#   Qwen/Qwen2.5-VL-72B-Instruct:hyperbolic
#   meta-llama/Llama-4-Scout-17B-16E-Instruct:fireworks-ai
#
# ONLY vision (VLM) models will see the image. A text-only model silently
# ignores it and invents fixtures, which is worse than failing outright.
# Browse: https://huggingface.co/models?pipeline_tag=image-text-to-text
# ---------------------------------------------------------------------
ai.huggingface.base-url=https://router.huggingface.co/v1
ai.huggingface.api-key=${HF_TOKEN:}
ai.huggingface.models=Qwen/Qwen2.5-VL-72B-Instruct,meta-llama/Llama-4-Scout-17B-16E-Instruct,Qwen/Qwen2.5-VL-7B-Instruct,google/gemma-3-27b-it

# ---------------------------------------------------------------------
# NVIDIA NIM  -  https://build.nvidia.com
# ---------------------------------------------------------------------
ai.nvidia.base-url=https://integrate.api.nvidia.com/v1
ai.nvidia.api-key=${NVIDIA_API_KEY:}
ai.nvidia.models=meta/llama-3.2-90b-vision-instruct,meta/llama-3.2-11b-vision-instruct

# ---------------------------------------------------------------------
# Together AI  -  https://api.together.xyz/settings/api-keys
# ---------------------------------------------------------------------
ai.together.base-url=https://api.together.xyz/v1
ai.together.api-key=${TOGETHER_API_KEY:}
ai.together.models=Qwen/Qwen2.5-VL-72B-Instruct

# ---------------------------------------------------------------------
# OpenRouter  -  https://openrouter.ai/keys
# ---------------------------------------------------------------------
ai.openrouter.base-url=https://openrouter.ai/api/v1
ai.openrouter.api-key=${OPENROUTER_API_KEY:}
ai.openrouter.models=qwen/qwen2.5-vl-72b-instruct,google/gemini-2.0-flash-001

# ---------------------------------------------------------------------
# Image preparation - shrink before base64 so payloads stay under limits
# ---------------------------------------------------------------------
ai.image.max-edge-px=1024
ai.image.max-base64-bytes=180000
ai.image.jpeg-quality=0.75

# ---------------------------------------------------------------------
# LOGGING
#
# INFO gives you: the full attempt chain at startup of each scan, image
# sizes before/after, HTTP status + latency per attempt, token usage,
# picks parsed, and a summary table at the end.
#
# DEBUG adds: stack traces, per-encode-pass image sizes, response previews,
# provider enable/skip decisions.
# ---------------------------------------------------------------------
logging.level.com.example.subscription.service.NvidiaAiService=DEBUG

# Raw payload logging - keep OFF in production, these lines are large.
# The ".wire" logger is separate so you can enable payloads without
# drowning in the rest of DEBUG.
logging.level.com.example.subscription.service.NvidiaAiService.wire=INFO
ai.log.full-response=false
ai.log.request-body=false
ai.log.preview-chars=400

# Put the scan trace id on every line. All log lines for one scan share it,
# so concurrent scans stay separable in the file.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{scanId:-........}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{scanId:-........}] %logger{36} - %msg%n

# Optional: write scans to a file you can tail.
# logging.file.name=logs/predator-scan.log

ai.cerebras.api-key=${CEREBRAS_API_KEY:}

ai.gemini.api-key=${GEMINI_API_KEY:AQ.Ab8RN6JJbPuV6CFbaFCzchaYN3RGcdKiMRXQVFN4T3-8wIoksg}
